[package]
name = "phosphlux"
version = "0.1.0"
edition = "2024"
description = "Phosphlux - Real-time GPU analog video synthesizer"
license = "MIT"
repository = "https://github.com/yourusername/phosphlux"
keywords = ["video-synthesis", "wgpu", "analog", "graphics", "real-time"]
categories = ["graphics", "multimedia", "rendering"]

[dependencies]
# GPU compute - must match egui-wgpu's wgpu version
wgpu = "23"
pollster = "0.4"              # Block on async for wgpu

# Windowing
winit = "0.30"

# GUI
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"

# Math
glam = "0.29"                 # Fast vector math
bytemuck = { version = "1.14", features = ["derive"] }  # Safe transmutes for GPU buffers

# Timing
instant = "0.1"

# Serialization (for presets/patches)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # Some optimization even in dev for real-time work
