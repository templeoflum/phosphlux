[package]
name = "device-workbench"
version = "0.1.0"
edition = "2021"
description = "Lightweight device emulation workbench with Claude integration"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP API
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }

# GPU rendering
wgpu = "23"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Image handling
image = "0.25"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"

# UI (optional, for parameter controls)
# egui = "0.27"
# egui-wgpu = "0.27"
# egui-winit = "0.27"

[profile.release]
opt-level = 3
lto = true
